name: restore-truncated-files
on:
  push:
    branches: [main]
jobs:
  restore:
    if: github.event.head_commit.message == 'Add one-shot file restore workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last good copies and self-delete
        run: |
          set -euo pipefail
          git checkout b753cb61 -- js/game.js js/result.js js/analysis.js index.html css/result.css
          rm -f .github/workflows/restore-truncated-files.yml
          git add -A
          git config user.name "Bill.Xie"
          git config user.email "66951589+xie96808@users.noreply.github.com"
          git commit -m "Restore files truncated by placeholder push"
          git push
