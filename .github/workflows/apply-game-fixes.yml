name: apply-game-fixes
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.event.head_commit.message == 'Add one-shot game fixes workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches and self-delete
        run: |
          set -euo pipefail
          python3 scripts/apply_game_fixes.py
          rm -f scripts/apply_game_fixes.py .github/workflows/apply-game-fixes.yml
          rmdir scripts 2>/dev/null || true
          git add -A
          git config user.name "Bill.Xie"
          git config user.email "66951589+xie96808@users.noreply.github.com"
          git commit -m "Fix T+1 sell on fill day, add daily return, result home, causal trade signals"
          git push
