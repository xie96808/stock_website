name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Android SDK env
        run: |
          # ubuntu-latest runners ship an Android SDK; avoid android-actions/setup-android
          # (it still tries to install the removed legacy "tools" package).
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT"
          test -d "$SDK_ROOT" || { echo "Android SDK not found at $SDK_ROOT" >&2; exit 1; }
          # Accept licenses so AGP can download platforms/build-tools as needed.
          mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$SDK_ROOT/licenses/android-sdk-license"
          printf '%s\n' "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" \
            > "$SDK_ROOT/licenses/android-sdk-preview-license"
          ls "$SDK_ROOT" | head

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stockgame-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/stockgame-release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_OUTPUT"
            echo "Using release keystore signing"
          else
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "WARNING: release signing secrets missing; building debug APK"
          fi

      - name: Unit tests (updater logic)
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        working-directory: android-app
        run: |
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          VER="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android-app/app/build.gradle.kts | head -n1)"
          test -n "$VER" || { echo "versionName not found" >&2; exit 1; }
          if [[ -f android-app/app/build/outputs/apk/release/app-release.apk ]]; then
            SRC=android-app/app/build/outputs/apk/release/app-release.apk
            NAME="stockgame-$VER.apk"
          elif [[ -f android-app/app/build/outputs/apk/debug/app-debug.apk ]]; then
            SRC=android-app/app/build/outputs/apk/debug/app-debug.apk
            NAME="stockgame-$VER-debug.apk"
          else
            echo "No APK found" >&2
            find android-app/app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "dist/$NAME"
          sha256sum "dist/$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockgame-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
