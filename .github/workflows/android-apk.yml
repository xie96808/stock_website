name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stockgame-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/stockgame-release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_OUTPUT"
            echo "Using release keystore signing"
          else
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "WARNING: release signing secrets missing; building unsigned/debug-signed APK"
          fi

      - name: Build release APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          if [[ -f android-app/app/build/outputs/apk/release/app-release.apk ]]; then
            SRC=android-app/app/build/outputs/apk/release/app-release.apk
            NAME=stockgame-1.0.0.apk
          elif [[ -f android-app/app/build/outputs/apk/debug/app-debug.apk ]]; then
            SRC=android-app/app/build/outputs/apk/debug/app-debug.apk
            NAME=stockgame-1.0.0-debug.apk
          else
            echo "No APK found" >&2
            find android-app/app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "dist/$NAME"
          sha256sum "dist/$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockgame-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
