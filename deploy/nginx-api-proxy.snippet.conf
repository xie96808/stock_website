# Snippet for production HTTPS server (Certbot-managed on Aliyun).
# Paste inside the existing server { listen 443 ssl; ... } for stockgame.xieyw.top,
# BEFORE location /. Do not remove SSL directives.
#
# Port note: canonical is 8787. On 121.199.33.29, 8787 may already be bound by
# another Node app - then use 8790 in api.env and here.

    client_max_body_size 256k;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_intercept_errors off;
    }
