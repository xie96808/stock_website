server {
    listen 80;
    listen [::]:80;
    server_name stockgame.xieyw.top;

    root /srv/stock-website/current;
    index index.html;

    client_max_body_size 256k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    gzip_static on;

    # API -> Node Express on loopback. Must be before location /.
    # Production HTTPS is Certbot-managed separately - merge this /api/ block into
    # the 443 server; do not replace the live TLS server with this HTTP-only file.
    # If 127.0.0.1:8787 is already taken, change PORT in /etc/stockgame/api.env and
    # proxy_pass to match (see deploy/README-api.md).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Unknown /api/* must NOT fall through to index.html
        proxy_intercept_errors off;
    }

    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
