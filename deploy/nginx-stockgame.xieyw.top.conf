server {
    listen 80;
    listen [::]:80;
    server_name stockgame.xieyw.top;

    root /srv/stock-website/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    gzip_static on;

    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
