server {
    listen 80;
    listen [::]:80;
    server_name stockgame.xieyw.top;

    root /srv/stock-website/current;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    gzip_static on;

    # Brotli (requires ngx_brotli / libnginx-mod-http-brotli on the VPS).
    # Prefer precompressed .br from package-production.sh; dynamic brotli is fallback.
    # If nginx -t fails on these directives, install the module (see docs/phase4-cheap-perf.md)
    # or temporarily comment them out — gzip_static still works.
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # API -> Node Express on loopback. Must be before location /.
    # Production HTTPS is Certbot-managed separately - merge this /api/ block into
    # the 443 server; do not replace the live TLS server with this HTTP-only file.
    # If 127.0.0.1:8787 is already taken, change PORT in /etc/stockgame/api.env and
    # proxy_pass to match (see deploy/README-api.md).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Unknown /api/* must NOT fall through to index.html
        proxy_intercept_errors off;
    }


    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Versioned stocks pack: immutable long-cache (sha in filename).
    # gzip_static / brotli_static still apply from server-level flags.
    location ~* "^/data/stocks_data\.[a-f0-9]{64}\.json$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pack pointer — must not be long-cached (clients discover new sha here).
    location = /data/pack-meta.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Unversioned pack fallback for old clients / local.
    location = /data/stocks_data.json {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location = /data/stocks_data.js {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }


    # js/css get ?v=<revision> at package time (see stamp-asset-revision.mjs).
    # must-revalidate complements residual unstamped relative imports / old tabs.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
