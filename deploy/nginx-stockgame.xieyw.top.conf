server {
    listen 80;
    listen [::]:80;
    server_name stockgame.xieyw.top;

    root /srv/stock-website/current;
    index index.html;

    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
