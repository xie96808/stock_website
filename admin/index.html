<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>治理后台 · 早知道当初不炒了</title>
  <link rel="shortcut icon" href="/favicon.ico?v=20260908">
  <link rel="icon" href="/favicon.ico?v=20260908" type="image/x-icon" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png?v=20260908">
  <link rel="icon" type="image/png" href="/favicon.png?v=20260908">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=20260908">
  <link rel="stylesheet" href="./admin.css" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>最小治理后台</h1>
      <p class="note">非公网运营工具 · 禁用/软删用户 / 下榜与判无效 / 审计。需管理员账号 + 二次验证。整库恢复仅 CLI。</p>
    </header>

    <section id="loginPanel" class="card">
      <h2>登录</h2>
      <label>用户名 <input id="loginUser" autocomplete="username" /></label>
      <label>密码 <input id="loginPass" type="password" autocomplete="current-password" /></label>
      <button type="button" id="loginBtn">登录</button>
      <p id="loginMsg" class="msg"></p>
    </section>

    <section id="opsPanel" class="card hidden">
      <div class="row between">
        <div>
          <strong id="whoami"></strong>
          <span id="verifyBadge" class="badge">未二次验证</span>
        </div>
        <div class="row">
          <input id="reauthPass" type="password" placeholder="管理员密码" />
          <button type="button" id="reauthBtn">二次验证（15 分钟）</button>
          <button type="button" id="logoutBtn" class="ghost">退出</button>
        </div>
      </div>
      <p id="opsMsg" class="msg"></p>

      <h2>用户 · 禁用 / 解禁 / 软删 / 恢复</h2>
      <div class="row">
        <input id="userQ" placeholder="用户 ID / 登录名 / 昵称" />
        <select id="userStatus">
          <option value="">未注销</option>
          <option value="active">active</option>
          <option value="disabled">disabled</option>
          <option value="deleted">deleted</option>
        </select>
        <button type="button" id="userSearchBtn">搜索</button>
      </div>
      <div id="userList" class="list"></div>
      <div class="row">
        <input id="banUserId" placeholder="用户 ID" />
        <select id="banStatus">
          <option value="disabled">禁用</option>
          <option value="active">解禁</option>
        </select>
        <input id="banReason" class="grow" placeholder="原因（必填）" />
        <button type="button" id="banBtn">提交禁用/解禁</button>
      </div>
      <div class="row">
        <input id="delUserId" placeholder="用户 ID（软删/恢复）" />
        <input id="delReason" class="grow" placeholder="原因（必填）" />
        <button type="button" id="softDeleteBtn">软删用户</button>
        <button type="button" id="restoreUserBtn">恢复软删</button>
      </div>
      <p class="note">软删会写 tombstone 并撤销会话；整库备份恢复仍仅 CLI。自助注销（凭据已清）不可在此恢复登录。</p>

      <h2>韭币 · 余额调整</h2>
      <div class="row">
        <input id="coinUserId" placeholder="用户 ID" />
        <select id="coinOp">
          <option value="add">增加</option>
          <option value="sub">扣减</option>
          <option value="set">设为</option>
        </select>
        <input id="coinAmount" type="number" min="0" step="1" placeholder="数量" style="max-width:7rem" />
        <input id="coinReason" class="grow" placeholder="原因（必填）" />
        <button type="button" id="coinAdjustBtn">提交调整</button>
      </div>
      <p class="note">用户列表会显示当前韭币余额；调整需二次验证，写入审计。</p>

      <h2>战绩 · 下榜 / 判无效</h2>
      <div class="row">
        <input id="gameQ" class="grow" placeholder="对局 ID / 用户 ID / 登录名 / 昵称" />
        <button type="button" id="gameSearchBtn">搜索</button>
      </div>
      <div id="gameList" class="list"></div>
      <div class="row">
        <input id="modGameId" class="grow" placeholder="对局 ID" />
        <select id="modAction">
          <option value="unlist">仅下榜</option>
          <option value="relist">恢复上榜</option>
          <option value="invalidate">判无效</option>
          <option value="restore">恢复有效</option>
        </select>
        <input id="modReason" class="grow" placeholder="原因（必填）" />
        <button type="button" id="modBtn">提交</button>
      </div>


      <h2>系统公告 · 发布 / 草稿 / 归档</h2>
      <div class="row">
        <select id="annStatusFilter">
          <option value="">全部</option>
          <option value="published">published</option>
          <option value="draft">draft</option>
          <option value="archived">archived</option>
        </select>
        <button type="button" id="annSearchBtn">刷新列表</button>
      </div>
      <div id="annList" class="list"></div>
      <div class="row">
        <input id="annId" placeholder="ID（更新/归档时填）" style="max-width:7rem" />
        <input id="annTitle" placeholder="标题（可选）" />
        <select id="annStatus">
          <option value="draft">draft</option>
          <option value="published">published</option>
          <option value="archived">archived</option>
        </select>
      </div>
      <div class="row">
        <textarea id="annBody" class="grow" rows="3" placeholder="正文（必填）" style="width:100%;min-height:4.5rem;font:inherit"></textarea>
      </div>
      <div class="row">
        <button type="button" id="annCreateBtn">新建</button>
        <button type="button" id="annUpdateBtn">更新</button>
        <button type="button" id="annPublishBtn">发布</button>
        <button type="button" id="annArchiveBtn">归档</button>
      </div>
      <p class="note">写操作需二次验证。公开页仅展示 published；「今日关闭」由访客本地日历日记住。</p>

      <h2>审计日志</h2>
      <div class="row">
        <button type="button" id="auditBtn">刷新最近审计</button>
      </div>
      <div id="auditList" class="list"></div>
    </section>
  </main>
  <script type="module" src="./admin.js"></script>
</body>
</html>
